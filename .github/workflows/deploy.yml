name: 🚀 Deploy to C4 Cloud (45.119.214.68)

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Cho phép chạy thủ công từ GitHub UI

jobs:
  deploy:
    name: 📦 Build & Deploy to C4 Cloud via SSH
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            user/package-lock.json
            admin/package-lock.json

      # ── Build User App (trang quét QR) ──────────────────────────────────────
      - name: 📦 Install User dependencies
        run: npm ci
        working-directory: user

      - name: 🔨 Build User App
        run: npm run build
        working-directory: user

      # ── Build Admin App ──────────────────────────────────────────────────────
      - name: 📦 Install Admin dependencies
        run: npm ci
        working-directory: admin

      - name: 🔨 Build Admin App
        run: npm run build
        working-directory: admin

      # ── Package Frontend & Server ────────────────────────────────────────────
      - name: 📦 Package deployment artifacts
        run: |
          cd user/dist && zip -r ../../user-dist-deploy.zip . && cd ../..
          cd admin/dist && zip -r ../../admin-dist-deploy.zip . && cd ../..
          cd server && zip -r ../server-deploy.zip \
            app.js server.js seed.js package.json .htaccess ecosystem.config.json \
            middleware/ models/ routes/ services/ scripts/ \
            --exclude "*/node_modules/*" --exclude "*/.env" && cd ..

      # ── Upload lên C4 Cloud qua SCP ──────────────────────────────────────────
      - name: 📤 Upload packages via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST || '45.119.214.68' }}
          username: ${{ secrets.SSH_USER || 'root' }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "user-dist-deploy.zip,admin-dist-deploy.zip,server-deploy.zip"
          target: "/root/deploy_tmp/"

      # ── SSH vào C4 Cloud: extract, npm install, restart PM2 & Nginx ─────────
      - name: 🔄 Deploy & Restart PM2 on C4 Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '45.119.214.68' }}
          username: ${{ secrets.SSH_USER || 'root' }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "=== Deploying to C4 Cloud (45.119.214.68) ==="
            mkdir -p /var/www/tem/user/dist /var/www/tem/admin/dist /var/www/tem/server

            # 1. Extract User & Admin Frontend
            unzip -o /root/deploy_tmp/user-dist-deploy.zip -d /var/www/tem/user/dist/ || [ $? -le 2 ]
            unzip -o /root/deploy_tmp/admin-dist-deploy.zip -d /var/www/tem/admin/dist/ || [ $? -le 2 ]

            # 2. Extract Server Backend (giữ nguyên .env & backups)
            unzip -o /root/deploy_tmp/server-deploy.zip -d /var/www/tem/server/ || [ $? -le 2 ]

            # 3. Install dependencies & reload PM2
            cd /var/www/tem/server
            npm install --production 2>&1 | tail -5
            pm2 reload tem-qr-server || pm2 start ecosystem.config.json
            pm2 save

            # 4. Cleanup temp files
            rm -f /root/deploy_tmp/user-dist-deploy.zip /root/deploy_tmp/admin-dist-deploy.zip /root/deploy_tmp/server-deploy.zip
            echo "=== C4 Cloud Deploy Completed! ==="

      # ── Health check ─────────────────────────────────────────────────────────
      - name: 🏥 Health check
        run: |
          sleep 5
          curl -f http://45.119.214.68/api/health || \
          curl -f https://www.giaiphapqrcode.vn/api/health || \
          echo "⚠️ Health check warning"
        continue-on-error: true
