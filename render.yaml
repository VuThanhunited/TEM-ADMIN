services:
  - type: web
    name: tem-admin-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_URL
        value: https://www.giaiphapqrcode.vn
    healthCheckPath: /api/health
    autoDeploy: true
